name: CI 
on:
  push:
   branches: [main]
  pull_request:
   branches: [main]

jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - name: Checkout Repository
     uses: actions/checkout@v5

   - name: setup .NET
     uses: actions/setup-dotnet@v5
     with: 
      dotnet-version: '10.0.x'

   - name: Restore Dependencies
     run: dotnet restore "src/HabitsDev.slnx"

   - name: build Project  
     run: dotnet build "src/HabitsDev.slnx"  --configuration Release --no-restore

   - name: Run Tests
     run: dotnet test "src/HabitsDev.slnx" --no-build --verbosity normal
